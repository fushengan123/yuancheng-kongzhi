name: LAN Test Builds

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Build target: Windows portable, iOS sideload package, or both"
        required: true
        default: both
        type: choice
        options:
          - windows
          - ios
          - both
      ios_bundle_id:
        description: "Bundle ID for the sideloaded iOS test build"
        required: false
        default: com.lantest.crossdesk
        type: string

permissions:
  contents: read

jobs:
  windows:
    if: ${{ inputs.platform == 'windows' || inputs.platform == 'both' }}
    name: Windows portable test build
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout code and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Ensure minimum Xmake version
        uses: ./.github/actions/ensure-xmake
        with:
          minimum-version: "3.1.1"

      - name: Configure and build CrossDesk
        shell: pwsh
        run: |
          xmake f -c -p windows -a x64 -m release --CROSSDESK_VERSION=v1.7.8-lantest --USE_CUDA=false --CROSSDESK_PORTABLE=true -y
          if ($LASTEXITCODE -ne 0) { throw "xmake configure failed with exit code $LASTEXITCODE" }
          xmake b -vy crossdesk
          if ($LASTEXITCODE -ne 0) { throw "xmake build failed with exit code $LASTEXITCODE" }

      - name: Package portable test build
        shell: pwsh
        run: |
          $buildDir = "${{ github.workspace }}\build\windows\x64\release"
          $archive = "${{ github.workspace }}\crossdesk-lan-win-x64.zip"
          if (!(Test-Path $buildDir)) { throw "Missing build directory: $buildDir" }
          $required = @("crossdesk.exe", "crossdesk_service.exe", "crossdesk_session_helper.exe")
          foreach ($name in $required) {
            if (!(Test-Path (Join-Path $buildDir $name))) { throw "Missing required binary: $name" }
          }
          Compress-Archive -Path "$buildDir\*" -DestinationPath $archive -Force
          Get-Item $archive | Select-Object FullName, Length | Format-List

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: crossdesk-lan-win-x64
          path: crossdesk-lan-win-x64.zip
          if-no-files-found: error

  ios:
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    name: iOS unsigned sideload build
    runs-on: macos-15
    timeout-minutes: 120
    env:
      IOS_DEPLOYMENT_TARGET: "16.0"
      XMAKE_MIN_VERSION: "3.1.1"
    steps:
      - name: Checkout code and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: Verify Xmake version
        shell: bash
        run: |
          xmake --version
          python3 -c 'import setuptools, wheel, pip' || python3 -m pip install setuptools wheel

      - name: Build native iOS dependencies
        shell: bash
        env:
          CONFIGURATION: Release
          PLATFORM_NAME: iphoneos
          CURRENT_ARCH: arm64
        run: |
          chmod +x apps/ios/scripts/build_minirtc_ios.sh
          apps/ios/scripts/build_minirtc_ios.sh

      - name: Build CrossDesk Mobile without code signing
        shell: bash
        run: |
          DERIVED_DATA="${RUNNER_TEMP}/CrossDeskMobileDerivedData"
          echo "DERIVED_DATA=${DERIVED_DATA}" >> "${GITHUB_ENV}"
          xcodebuild \
            -project apps/ios/CrossDeskMobile.xcodeproj \
            -scheme CrossDeskMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "${DERIVED_DATA}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="${{ inputs.ios_bundle_id }}" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            MARKETING_VERSION=1.7.8 \
            IPHONEOS_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
            build

      - name: Verify iOS app bundle
        shell: bash
        run: |
          APP="${DERIVED_DATA}/Build/Products/Release-iphoneos/CrossDeskMobile.app"
          test -x "${APP}/CrossDeskMobile" || { echo "Missing executable" >&2; exit 1; }
          xcrun lipo "${APP}/CrossDeskMobile" -verify_arch arm64

      - name: Package unsigned IPA and app archive
        shell: bash
        run: |
          APP="${DERIVED_DATA}/Build/Products/Release-iphoneos/CrossDeskMobile.app"
          STAGE="$(mktemp -d)"
          mkdir -p "${STAGE}/Payload"
          cp -R "${APP}" "${STAGE}/Payload/"
          (cd "${STAGE}" && zip -q -r "${GITHUB_WORKSPACE}/crossdesk-lan-ios-unsigned.ipa" Payload)
          ditto -c -k --sequesterRsrc --keepParent "${APP}" "${GITHUB_WORKSPACE}/crossdesk-lan-ios-unsigned.app.zip"
          ls -lh "${GITHUB_WORKSPACE}/crossdesk-lan-ios-unsigned.ipa" "${GITHUB_WORKSPACE}/crossdesk-lan-ios-unsigned.app.zip"

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: crossdesk-lan-ios-unsigned
          path: |
            crossdesk-lan-ios-unsigned.ipa
            crossdesk-lan-ios-unsigned.app.zip
          if-no-files-found: error
